; Copie este arquivo para C:\FECHAMENTO\painel_config.ini e preencha.
; NUNCA coloque o arquivo preenchido no GitHub (ele tem o segredo).

[painel]
; Endereco do painel administrativo
url = https://ricapetadministrativo.vercel.app
; Mesmo valor da variavel CRON_SECRET da Vercel (o mesmo usado no cron-job.org)
secret = COLE_AQUI_O_CRON_SECRET

[planilha]
; Pasta onde o fechamento salva a planilha final
pasta = C:\FECHAMENTO
; Nome do arquivo (* = qualquer coisa). Se tiver mais de um, usa o mais recente.
padrao = Fechamento_*.xlsx
