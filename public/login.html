<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Ricapet</title>
<link rel="icon" type="image/png" href="favicon-ricapet.png">
<script>(function(){try{var t=localStorage.getItem('ricapet_tema2');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/tokens-admin.css">
<script src="assets/tema.js" defer></script>
<style>
  /* Card, tema-toggle, botão primário etc. já vêm de assets/tokens-admin.css
     (Design System compartilhado) -- aqui fica só o que é específico desta
     página: o formulário de login não tem sidebar nem marca d'água por
     design (card pequeno e centralizado, sem "fundo" pra mostrar a marca
     d'água), então não usa esses dois componentes do Design System. */
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; font-family: var(--font-body);
    background: var(--page-bg); color: var(--text);
  }
  /* .card (Design System) já dá fundo/borda/raio/sombra -- aqui só o
     tamanho e o espaço pro tema-toggle posicionado em absoluto. */
  .card-login { position: relative; width: 100%; max-width: 340px; padding: 28px 24px; }
  /* .tema-toggle (Design System) foi pensado pra ficar sobre a sidebar/
     topbar escura -- aqui o fundo é o card branco, então as cores de
     contraste precisam ser as de superfície em vez das de sidebar. */
  .card-login .tema-toggle { position: absolute; top: 10px; right: 10px; background: var(--bg-card-2); border-color: var(--border-soft); }
  .card-login .tema-toggle button { color: var(--text-secondary); }
  .card-login .tema-toggle button.ativo { background: var(--bg-card); color: var(--brand-primary-dark); box-shadow: 0 1px 3px var(--shadow); }
  .marca { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .marca img { width: 40px; height: 40px; object-fit: contain; }
  .marca-nome { font-family: var(--font-display); font-size: 15px; font-weight: 700; }
  .marca-sub { font-size: 11px; color: var(--muted); }
  .campo { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .campo label { font-size: 11px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); }
  .campo input {
    height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-page);
    color: var(--text); padding: 0 13px; font-size: 15px; font-family: inherit;
  }
  .campo input:focus { outline: none; border-color: var(--brand-primary); }
  #inNome { text-align: center; }
  input[type="password"] { letter-spacing: 8px; text-align: center; font-size: 18px; }
  /* .btn-entrar já herda fundo/cor/hover verde de .btn.primary (Design
     System) -- aqui só o tamanho de botão largo, específico do login. */
  .btn-entrar {
    width: 100%; height: 44px; border: none; border-radius: 10px;
    font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 4px;
  }
  .btn-entrar:disabled { opacity: 0.5; cursor: default; }
  .erro { color: var(--danger); font-size: 13px; min-height: 1.2em; margin: 10px 0 0; }
</style>
</head>
<body>
<form class="card card-login" id="formLogin" autocomplete="off">
  <div class="tema-toggle" data-tema-toggle>
    <button type="button" data-tema="light" title="Tema claro">☀</button>
    <button type="button" data-tema="dark" title="Tema escuro">☾</button>
  </div>
  <div class="marca">
    <img src="logo-ricapet.png" alt="Ricapet">
    <div>
      <div class="marca-nome">Ricapet</div>
      <div class="marca-sub">Painel Administrativo</div>
    </div>
  </div>
  <div class="campo">
    <label for="inNome">Nome</label>
    <input type="text" id="inNome" required autocomplete="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-bwignore>
  </div>
  <div class="campo">
    <label for="inPin">PIN</label>
    <input type="password" id="inPin" inputmode="numeric" maxlength="8" required autocomplete="new-password" data-lpignore="true" data-1p-ignore data-bwignore>
  </div>
  <button type="submit" class="btn-entrar" id="btnEntrar">Entrar</button>
  <p class="erro" id="erroLogin"></p>
</form>
<script>
  const CHAVE_SESSAO = 'ricapet_sessao';

  // sessionStorage (não localStorage): a sessão só vale enquanto a aba
  // ficar aberta. Fechou o navegador/aba, a próxima visita ao link cai
  // aqui de novo, com o formulário em branco (nome e PIN sempre pedidos
  // de novo, sem mostrar quem logou da última vez).
  //
  // Mesma duração/checagem de assets/auth.js (DURACAO_SESSAO_ADMIN_MS,
  // 8h) -- duplicada aqui porque este arquivo não linka auth.js (evita o
  // próprio auth.js redirecionar login.html pra si mesmo em loop). Sem
  // isso, uma sessão expirada que por algum motivo chegasse aqui ainda
  // presente no sessionStorage pularia o formulário de login direto.
  function sessaoValidaEAtiva() {
    try {
      const sessao = JSON.parse(sessionStorage.getItem(CHAVE_SESSAO) || 'null');
      if (!sessao || !sessao.token) return false;
      const payload = String(sessao.token).split('.')[0];
      const emissao = JSON.parse(atob(payload.replace(/-/g, '+').replace(/_/g, '/'))).emissao;
      const DURACAO_SESSAO_ADMIN_MS = 8 * 60 * 60 * 1000;
      return !!emissao && (Date.now() - emissao) <= DURACAO_SESSAO_ADMIN_MS;
    } catch (e) { return false; }
  }
  if (sessaoValidaEAtiva()) irParaDestino();
  else sessionStorage.removeItem(CHAVE_SESSAO);

  function irParaDestino() {
    const redirect = new URLSearchParams(location.search).get('redirect');
    location.href = redirect ? decodeURIComponent(redirect) : '/';
  }

  const form = document.getElementById('formLogin');
  const btnEntrar = document.getElementById('btnEntrar');
  const erroLogin = document.getElementById('erroLogin');

  // /api/debug exige este secret pra qualquer tipo=ponto-* (gate fraco,
  // pré-compartilhado — quem realmente autoriza é o PIN do funcionário,
  // validado no ponto-login abaixo). Mesmo valor já usado hoje em produção
  // pelo ricapet-ponto-admin (PONTO_PUBLIC_SECRET).
  const PONTO_PUBLIC_SECRET = 'f3BqH1JDY6dWb-n4aEhSVcZJrSPvU0Rf';

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    erroLogin.textContent = '';
    btnEntrar.disabled = true;
    try {
      const resp = await fetch('/api/debug?tipo=ponto-login&secret=' + encodeURIComponent(PONTO_PUBLIC_SECRET), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome: document.getElementById('inNome').value.trim(), pin: document.getElementById('inPin').value }),
      });
      const dados = await resp.json().catch(() => ({}));
      if (!resp.ok || dados.ok === false) throw new Error(dados.error || 'Falha ao entrar.');
      if (!dados.admin) throw new Error('Seu usuário não tem acesso a este painel.');
      sessionStorage.setItem(CHAVE_SESSAO, JSON.stringify({
        token: dados.token, nome: dados.nome, super_admin: !!dados.super_admin, paginas: dados.paginas || [],
      }));
      irParaDestino();
    } catch (err) {
      erroLogin.textContent = err.message;
      btnEntrar.disabled = false;
    }
  });
</script>
</body>
</html>
